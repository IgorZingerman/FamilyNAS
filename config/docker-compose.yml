#
# Reference stack: Immich (photos/videos) + Jellyfin (movies/music).
#
# The immich-server / immich-machine-learning / redis / database services below
# are Immich's own official compose services, reproduced here as a snapshot for
# reference — ALWAYS pull the current version from Immich's GitHub releases
# rather than trusting this copy to be up to date:
#
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The `jellyfin` service is hand-added and is the only part meant to be copied
# directly into your own compose file.
#
name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    # GPU access for hardware-accelerated video transcoding — see
    # docs/troubleshooting.md ("Immich doesn't inherit Jellyfin's GPU access")
    # for why this needs adding here separately even if Jellyfin already has it.
    devices:
      - /dev/dri:/dev/dri   # Intel QuickSync passthrough; omit if no compatible iGPU
    group_add:
      - '991'   # replace with your host's actual `render` group GID: getent group render
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    # Pin to whatever version Immich's current release compose specifies —
    # this MUST match your immich-server version, do not use a generic
    # postgres image, it lacks the vector extensions Immich's schema needs.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if your database isn't stored on SSD:
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  # --- Hand-added, not part of Immich's release ---
  jellyfin:
    container_name: jellyfin
    image: ghcr.io/jellyfin/jellyfin:latest
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /var/lib/jellyfin/config:/config
      - /var/lib/jellyfin/cache:/cache
      - /tank/media/movies:/data/movies:ro
      - /tank/media/music:/data/music:ro
    devices:
      - /dev/dri:/dev/dri   # Intel QuickSync passthrough; omit if no compatible iGPU
    group_add:
      - '991'   # replace with your host's actual `render` group GID: getent group render
    ports:
      - '8096:8096'
    restart: always

volumes:
  model-cache:
